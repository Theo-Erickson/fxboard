# FXboard: builds the "fxboard" flavor APK on GitHub Actions.
#
# - Pull requests: builds the APK and attaches it to the run, so a change can be tried
#   on the phone before it is merged.
# - Pushes to the fxboard branch (i.e. a merged PR): builds, then publishes a GitHub Release
#   with the APK attached. master only mirrors FUTO's upstream and never builds here. That release page is where to download and install from.
#
# Signing uses a private keystore stored in repository secrets, so every build has the same
# signature and installs as an update over the previous one. Never use the public debug
# keystore for builds you install: a keyboard sees everything you type.

name: Build FXboard APK

on:
  push:
    branches: [fxboard]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create releases

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out source with submodules
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so version numbers can be derived from git
          submodules: recursive
          lfs: true

      # Some submodules (models, swipe data) keep large files in Git LFS
      - name: Pull LFS files in submodules
        run: git submodule foreach --recursive 'git lfs pull || true'

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # The action's default also installs "tools", which newer SDKs no longer have, and fails
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      # Same NDK version FUTO's own CI image pins
      - name: Install NDK
        run: sdkmanager --install "ndk;28.2.13676358"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Compute version
        run: |
          # Base the name on the latest upstream FUTO tag, plus this workflow's run number.
          # Forks don't get FUTO's tags, so fetch them from upstream first.
          git fetch --no-recurse-submodules --tags https://github.com/futo-org/android-keyboard.git
          # Skip FXboard's own release tags and FUTO's release candidates, and drop the "v"
          # some older FUTO tags have, so names read like 0.1.30-r4.
          BASE="$(git describe --tags --abbrev=0 --exclude 'fxboard-*' --exclude '*-rc*' 2>/dev/null || echo 0.0.0)"
          BASE="${BASE#v}"
          echo "VERSION_NAME=${BASE}-r${{ github.run_number }}" >> "$GITHUB_ENV"
          # Run number only ever increases, so each build installs over the last
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "BRANCH_NAME=${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" >> "$GITHUB_ENV"

      - name: Write signing config
        env:
          KEYSTORE_B64: ${{ secrets.FORK_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FORK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FORK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FORK_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Signing secrets are missing. Add FORK_KEYSTORE_B64 and friends in the repo settings."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > fork-release.jks
          {
            echo "storeFile=fork-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build APK
        run: ./gradlew assembleFxboardRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp build/outputs/apk/fxboard/release/*.apk "out/fxboard-${VERSION_NAME}.apk"
          ls -la out

      - name: Upload APK to the run
        uses: actions/upload-artifact@v7
        with:
          name: fxboard-${{ env.VERSION_NAME }}
          path: out/*.apk

      - name: Publish release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: fxboard-r${{ github.run_number }}
          name: FXboard ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          body: |
            FXboard, an unofficial modified build of FUTO Keyboard. Not made, endorsed or supported by FUTO.
            Built from ${{ github.sha }}.
          files: out/*.apk
